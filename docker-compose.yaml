services:
  prisma-migrate:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    command: bunx prisma migrate deploy
    restart: "no"

  file-server:
    build:
      context: .
      dockerfile: Dockerfile.m
    image: file-server:latest
    container_name: file-server
    env_file:
      - .env
    ports:
      - "3002:3002"
    volumes:
      - /var/www/file-server-uploads:/uploads
    depends_on:
      - prisma-migrate
    restart: unless-stopped
